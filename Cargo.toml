[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/donaldfilimon/abi"

[workspace.dependencies]
abi-agent-host = { path = "crates/abi-agent-host" }
abi-agent-runtime = { path = "crates/abi-agent-runtime" }
abi-compute = { path = "../wdbx/crates/abi-compute" }
abi-models = { path = "crates/abi-models" }
abi-worker = { path = "crates/abi-worker" }
abi-foundation = { path = "../wdbx/crates/abi-foundation" }
abi-core = { path = "../wdbx/crates/abi-core" }
abi-telemetry = { path = "../wdbx/crates/abi-telemetry" }
abi-plugins = { path = "crates/abi-plugins" }
abi-ai = { path = "crates/abi-ai" }
abi-sea = { path = "crates/abi-sea" }
abi-gpu = { path = "crates/abi-gpu" }
abi-nn = { path = "crates/abi-nn" }
abi-connectors = { path = "crates/abi-connectors" }
abi-wdbx = { path = "../wdbx/crates/abi-wdbx" }
abi-wdbx-gateway = { path = "crates/abi-wdbx-gateway" }

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0.49.9", default-features = false }
sha2 = "0.10"
crc32fast = "1"
ctrlc = "3"
num-bigint = "0.4"
num-traits = "0.2"
nix = { version = "0.30", features = ["user"] }
libc = "0.2"
thiserror = "2"
wyhash = "0.5"
zeroize = { version = "1", features = ["derive"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
chacha20poly1305 = { version = "0.11", features = ["getrandom"] }
ed25519-dalek = "3"
tfhe = { version = "=1.7.0", default-features = false, features = ["boolean", "integer", "shortint"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
