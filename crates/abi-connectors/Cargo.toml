[package]
name = "abi-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "External-service connectors for the ABI framework: OpenAI, Anthropic, Grok, Discord, Twilio."

[dependencies]
abi-foundation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"

# Blocking HTTP for the live transport. Rust std has no HTTP client, so the Zig
# std.http.Client has no direct equivalent; ureq is blocking (matching the
# scheduler's synchronous model) and uses rustls rather than linking OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

# Direct TLS for live Discord/Twilio WebSocket clients (no external proxy).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
webpki-roots = { version = "1", optional = true }
rustls-pki-types = { version = "1", optional = true }

[dev-dependencies]
# Process-local TLS peers for offline WS handshake/frame tests (no network).
rcgen = "0.13"

[features]
default = ["live", "foundationmodels"]
# The live transport. Disable to build a connectors crate that can only use the
# local synthesized transport — useful for offline or minimal builds.
live = ["ureq", "rustls", "webpki-roots", "rustls-pki-types"]
# Apple FoundationModels on-device bridge (arm64 macOS only; no-op elsewhere).
# Compiles `native/fm_shim.swift` → `libabi_fm_shim.dylib` and links it.
foundationmodels = []

[lints]
workspace = true
