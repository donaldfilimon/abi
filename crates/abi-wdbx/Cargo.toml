[package]
name = "abi-wdbx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "WDBX vector store for the ABI framework: on-disk segment format, MVCC epoch layering, and the audit chain."

[features]
default = []
experimental-dghv-bootstrap = []
full-fhe = ["dep:tfhe"]

[dependencies]
abi-compute = { workspace = true }
abi-foundation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
crc32fast = { workspace = true }
num-bigint = { workspace = true }
num-traits = { workspace = true }
wyhash = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
tfhe = { workspace = true, optional = true }

[lints]
workspace = true
