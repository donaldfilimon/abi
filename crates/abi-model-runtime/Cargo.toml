[package]
name = "abi-model-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Explicit local model loading and evidenced Candle execution for ABI."

[features]
default = []
metal = ["candle-core/metal"]
cuda = ["candle-core/cuda"]

[dependencies]
abi-agent-runtime = { workspace = true }
abi-compute = { workspace = true }
abi-models = { workspace = true }
# Upstream PR #4041 upgrades ZIP and handles its fallible filename API.
# Use the immutable reviewed revision until a fixed release is available:
# https://github.com/huggingface/candle/pull/4041
candle-core = { git = "https://github.com/huggingface/candle.git", rev = "70f72e9cfdbfc570846ca363ead2135394af3e9a", version = "0.11", default-features = false }
safetensors = "0.8"
thiserror = { workspace = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
abi-foundation = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
