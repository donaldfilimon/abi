[package]
name = "abi-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU/backend detection for the ABI framework with optional Metal DOT kernels on macOS."

[features]
default = ["metal-kernels", "coreml-ane"]
# Link Metal compute DOT kernel (macOS). When init fails, accelerated stays false.
metal-kernels = []
# Compile the Apple helper that requests CoreML `.cpuAndNeuralEngine`.
coreml-ane = []
# Compile claim-honest adapters. Toolchain detection never implies runtime use.
cuda-adapter = []
vulkan-adapter = []

[dependencies]
abi-compute = { workspace = true }
abi-foundation = { path = "../abi-foundation" }

[lints]
workspace = true
