[package]
name = "abi-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GPU/backend detection for the ABI framework with optional Metal DOT kernels on macOS."

[features]
default = ["metal-kernels"]
# Link Metal compute DOT kernel (macOS). When init fails, accelerated stays false.
metal-kernels = []

[dependencies]
abi-foundation = { path = "../abi-foundation" }
abi-wdbx = { path = "../abi-wdbx" }

[lints]
workspace = true
