[package]
name = "abi-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "ABI command metadata, help rendering, and process dispatch."

[features]
default = []
experimental-dghv-bootstrap = ["abi-wdbx/experimental-dghv-bootstrap"]
full-fhe = ["abi-wdbx/full-fhe"]

[[bin]]
name = "abi"
path = "src/main.rs"

[dependencies]
abi-core = { workspace = true }
abi-plugins = { workspace = true }
abi-foundation = { workspace = true }
abi-telemetry = { workspace = true }
abi-ai = { workspace = true }
abi-sea = { workspace = true }
abi-nn = { workspace = true }
abi-gpu = { workspace = true }
abi-connectors = { workspace = true }
abi-wdbx = { workspace = true }
ctrlc = { workspace = true }
serde_json = { workspace = true }
libc = "0.2"
unicode-width = { workspace = true }

[lints]
workspace = true
