syntax = "proto3";

package abi.wdbx.gateway.v1;

service WdbxGateway {
  rpc PutVector(PutVectorRequest) returns (PutVectorResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc PutKv(PutKvRequest) returns (PutKvResponse);
  rpc GetKv(GetKvRequest) returns (GetKvResponse);
  rpc ResolveConflict(ResolveConflictRequest) returns (ResolveConflictResponse);
  rpc Stats(StatsRequest) returns (StatsResponse);
  rpc MembershipChange(MembershipChangeRequest) returns (MembershipChangeResponse);
  rpc WatchMutations(WatchMutationsRequest) returns (stream MutationEvent);
  // Canonical episode gate over the WDBX v3 episode store (Program 4, step 4).
  rpc ProposeEpisodeWrite(ProposeEpisodeWriteRequest) returns (ProposeEpisodeWriteResponse);
  rpc VerifyEpisode(VerifyEpisodeRequest) returns (VerifyEpisodeResponse);
}

message VectorInput { repeated float values = 1; }
message PutVectorRequest { repeated VectorInput vectors = 1; }
message PutVectorResponse { repeated string ids = 1; }

message SearchRequest {
  repeated float query = 1;
  uint32 limit = 2;
}
message SearchHit {
  string id = 1;
  float score = 2;
}
message SearchResponse { repeated SearchHit hits = 1; }

message KvEntry {
  string key = 1;
  string value = 2;
}
message PutKvRequest { repeated KvEntry entries = 1; }
message PutKvResponse { repeated string transaction_ids = 1; }
message GetKvRequest { string key = 1; }
message GetKvResponse {
  bool found = 1;
  string value = 2;
  repeated string version_ids = 3;
}

message ResolveConflictRequest {
  string key = 1;
  repeated string version_ids = 2;
  string value = 3;
}
message ResolveConflictResponse { string transaction_id = 1; }

message StatsRequest {}
message StatsResponse {
  uint64 kv_entries = 1;
  uint64 vectors = 2;
  uint64 blocks = 3;
  uint64 spatial_records = 4;
  uint64 temporal_nodes = 5;
  uint64 temporal_edges = 6;
  uint64 members = 7;
}

enum MembershipAction {
  MEMBERSHIP_ACTION_UNSPECIFIED = 0;
  MEMBERSHIP_ACTION_ADD = 1;
  MEMBERSHIP_ACTION_REMOVE = 2;
}
message MembershipChangeRequest {
  // Durable signed gateway-local lineage; not separate-host cluster consensus.
  MembershipAction action = 1;
  string node_id = 2;
  string endpoint = 3;
}
message MembershipChangeResponse {
  bool changed = 1;
  uint64 members = 2;
  uint64 generation = 3;
  string head_digest = 4;
  bool tombstoned = 5;
}

message WatchMutationsRequest {}
message MutationEvent {
  uint64 sequence = 1;
  string kind = 2;
  string transaction_id = 3;
  uint32 item_count = 4;
  int64 unix_ms = 5;
}

// The episode write vocabulary is owned by `abi_wdbx::v3::episode::EpisodeWrite`
// and travels as its JSON encoding so the closed enums are defined in exactly
// one place. Unknown fields are rejected server-side.
message ProposeEpisodeWriteRequest {
  bytes episode_write_json = 1;
  // Compute the canonical commitment without appending anything.
  bool preview_only = 2;
}
// Sanitized, content-free receipt mirrored from the store.
message EpisodeReceipt {
  uint64 sequence = 1;
  string request_id = 2;
  string operation_id = 3;
  string guild_ref = 4;
  bytes episode_digest = 5;
  // Empty when the event opened its operation chain.
  bytes previous_digest = 6;
  string event_kind = 7;
  string policy_version = 8;
  string evidence_level = 9;
  // Empty unless the event is terminal.
  string terminal_status = 10;
  bool redacted = 11;
}
message ProposeEpisodeWriteResponse {
  // "appended" or "preview". Rejections are gRPC statuses whose message is
  // the store's stable reason label (for example `episode_replay`).
  string decision = 1;
  bytes episode_digest = 2;
  // Present only when the decision is "appended".
  EpisodeReceipt receipt = 3;
}
message VerifyEpisodeRequest {
  string guild_ref = 1;
  bytes episode_digest = 2;
}
message VerifyEpisodeResponse {
  bool found = 1;
  EpisodeReceipt receipt = 2;
}
