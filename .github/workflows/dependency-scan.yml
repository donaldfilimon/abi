name: Dependency Scan (skeleton)

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'

# Workflow-level permissions stay read-only: scorecard-action's workflow
# restrictions for publish_results: true allow write scopes only on the job.
# The job needs id-token: write to publish; no step uploads SARIF to code
# scanning, so it does not need security-events: write.
# https://github.com/ossf/scorecard-action#workflow-restrictions
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run OSSF Scorecard (read-only)
        uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-scan-results
          path: |
            results.sarif
            tools/security/

# Non-blocking scaffold. Configure preferred scanning tools and secrets as needed.
