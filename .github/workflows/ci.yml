name: CI

# Trusted same-repo events run on the macOS arm64 self-hosted runner.
# Fork PRs (and any untrusted head) stay on GitHub-hosted runners only —
# never schedule untrusted code on the self-hosted machine.
#
# Runner ops / security: .github/self-hosted-runner.md
# Primary gate: ./tools/check.sh (nightly Rust via tools/cargo.sh).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned for reproducibility, mirroring abbey's ABI_REVISION convention and
  # requirement R12 (a result must be tied to immutable code). Bump this only
  # through a reviewed change whose exact WDBX revision passes this workflow.
  WDBX_REVISION: f42b9789eabcf89f952df0a160a7b6837c5acb57

jobs:
  check:
    name: check (self-hosted)
    if: >
      github.repository == 'donaldfilimon/abi' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, abi]
    defaults:
      run:
        working-directory: abi
    steps:
      - uses: actions/checkout@v4
        with:
          path: abi
      # ABI's Cargo manifests consume these crates through ../wdbx. The public
      # source checkout remains pinned and must be a sibling so Cargo observes
      # one crate identity across ABI and WDBX.
      - name: Check out the public WDBX substrate as a sibling
        uses: actions/checkout@v4
        with:
          repository: donaldfilimon/wdbx
          ref: ${{ env.WDBX_REVISION }}
          path: wdbx
      - name: Ensure rustup nightly
        run: |
          rustup show
          rustup toolchain install nightly --profile minimal
          rustup component add --toolchain nightly rustfmt clippy rust-src
      - name: ./tools/check.sh
        run: ./tools/check.sh

  check-hosted:
    name: check (GitHub-hosted, fork PRs)
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    defaults:
      run:
        working-directory: abi
    steps:
      - uses: actions/checkout@v4
        with:
          path: abi
      - name: Check out the public WDBX substrate as a sibling
        uses: actions/checkout@v4
        with:
          repository: donaldfilimon/wdbx
          ref: ${{ env.WDBX_REVISION }}
          path: wdbx
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: ./tools/check.sh
        run: ./tools/check.sh

  # Windows credential DACL runtime proof (owner-only ACL apply + save_to_path).
  # Additive; does not replace the macOS primary gate.
  windows-acl:
    name: windows credential ACL
    if: >
      github.repository == 'donaldfilimon/abi' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: windows-latest
    defaults:
      run:
        working-directory: abi
    steps:
      - uses: actions/checkout@v4
        with:
          path: abi
      - name: Check out the public WDBX substrate as a sibling
        uses: actions/checkout@v4
        with:
          repository: donaldfilimon/wdbx
          ref: ${{ env.WDBX_REVISION }}
          path: wdbx
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Windows ACL + credentials file tests
        shell: bash
        run: |
          cargo test -p abi-foundation --lib -- credentials::windows_acl
          cargo test -p abi-foundation --lib -- credentials::file
