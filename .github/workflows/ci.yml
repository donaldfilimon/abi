name: CI

# Trusted same-repo events run on the macOS arm64 self-hosted runner.
# Fork PRs (and any untrusted head) stay on GitHub-hosted runners only —
# never schedule untrusted code on the self-hosted machine.
#
# Runner ops / security: .github/self-hosted-runner.md
# Primary gate: ./tools/check.sh (nightly Rust via tools/cargo.sh).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (self-hosted)
    if: >
      github.repository == 'donaldfilimon/abi' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, abi]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure rustup nightly
        run: |
          rustup show
          rustup toolchain install nightly --profile minimal
          rustup component add --toolchain nightly rustfmt clippy rust-src
      - name: ./tools/check.sh
        run: ./tools/check.sh

  check-hosted:
    name: check (GitHub-hosted, fork PRs)
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: ./tools/check.sh
        run: ./tools/check.sh
