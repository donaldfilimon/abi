name: CI

# Trusted same-repo events run on the macOS arm64 self-hosted runner.
# Fork PRs (and any untrusted head) get no job: never schedule untrusted code
# on the self-hosted machine. GitHub-hosted jobs cannot start while the
# account's Actions billing is locked, so this workflow has none.
#
# Runner ops / security: .github/self-hosted-runner.md
# Primary gate: ./tools/check.sh (nightly Rust via tools/cargo.sh).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned for reproducibility, mirroring abbey's ABI_REVISION convention and
  # requirement R12 (a result must be tied to immutable code). Bump this only
  # through a reviewed change whose exact WDBX revision passes this workflow.
  WDBX_REVISION: 3ac03f085196dbe6e922a127ceaa37bc2368de89

jobs:
  check:
    name: check (self-hosted)
    if: >
      github.repository == 'donaldfilimon/abi' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, abi]
    defaults:
      run:
        working-directory: abi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: abi
          persist-credentials: false
      # ABI's Cargo manifests consume these crates through ../wdbx. The public
      # source checkout remains pinned and must be a sibling so Cargo observes
      # one crate identity across ABI and WDBX.
      - name: Check out the public WDBX substrate as a sibling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: donaldfilimon/wdbx
          ref: ${{ env.WDBX_REVISION }}
          path: wdbx
          persist-credentials: false
      - name: Ensure exact repository toolchain
        run: |
          rustup show
          rustup toolchain install nightly-2026-09-01 --profile minimal --component rustfmt,clippy,rust-src
      - name: ./tools/check.sh
        run: ./tools/check.sh
