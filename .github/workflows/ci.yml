name: CI

# Trusted same-repo events run on the macOS arm64 self-hosted runner.
# Fork PRs (and any untrusted head) stay on GitHub-hosted runners only —
# never schedule untrusted code on the self-hosted machine.
#
# Runner ops / security: .github/self-hosted-runner.md
# Primary gate: ./tools/check.sh (nightly Rust via tools/cargo.sh).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned for reproducibility, mirroring abbey's ABI_REVISION convention and
  # requirement R12 (a result must be tied to immutable code). Bump this when
  # abi needs a newer substrate; an unpinned main would let a wdbx-substrate
  # commit break abi's gate with no change to abi.
  WDBX_REVISION: f42b9789eabcf89f952df0a160a7b6837c5acb57

jobs:
  check:
    name: check (self-hosted)
    if: >
      github.repository == 'donaldfilimon/abi' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: [self-hosted, macOS, ARM64, abi]
    defaults:
      run:
        working-directory: abi
    steps:
      - uses: actions/checkout@v4
        with:
          path: abi
      # WDBX was extracted to its own repository on 2026-08-22 and abi consumes
      # abi-foundation, abi-core, abi-telemetry, abi-compute, and abi-wdbx from
      # it by relative path. Cargo resolves `../wdbx/crates/...`, so the two
      # checkouts must be siblings or every job fails at manifest load.
      #
      # donaldfilimon/wdbx is PRIVATE, and the built-in GITHUB_TOKEN is scoped
      # to this repository only, so a separate credential is required. Set the
      # WDBX_CHECKOUT_TOKEN secret to a token with read access to it. Fork PRs
      # cannot read secrets, so the check-hosted job cannot pass while wdbx
      # stays private; that is a consequence of the visibility choice, not a
      # workflow defect.
      #
      # Fail with a sentence someone can act on, rather than a bare 403 from
      # actions/checkout. A gate that cannot run must say so loudly; skipping
      # the build would be a green result that proves nothing.
      - name: Require the substrate credential
        # shell: bash is REQUIRED, not stylistic. windows-latest defaults to
        # pwsh, which parses `if [ -z "..." ]; then` as a malformed PowerShell
        # `if` and dies with ParserError before the check ever runs.
        shell: bash
        run: |
          if [ -z "${{ secrets.WDBX_CHECKOUT_TOKEN }}" ]; then
            echo "::error::WDBX_CHECKOUT_TOKEN is not set. abi consumes"\
                 "abi-foundation, abi-core, abi-telemetry, abi-compute and"\
                 "abi-wdbx from the private donaldfilimon/wdbx"\
                 "repository by relative path, so this gate cannot run without"\
                 "read access to it. Add the secret, or make the substrate"\
                 "public and drop the token: line below."
            exit 1
          fi
        working-directory: .

      - name: Check out the WDBX substrate as a sibling
        uses: actions/checkout@v4
        with:
          repository: donaldfilimon/wdbx
          ref: ${{ env.WDBX_REVISION }}
          token: ${{ secrets.WDBX_CHECKOUT_TOKEN }}
          path: wdbx
      - name: Ensure rustup nightly
        run: |
          rustup show
          rustup toolchain install nightly --profile minimal
          rustup component add --toolchain nightly rustfmt clippy rust-src
      - name: ./tools/check.sh
        run: ./tools/check.sh

  check-hosted:
    name: check (GitHub-hosted, fork PRs)
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    defaults:
      run:
        working-directory: abi
    steps:
      - uses: actions/checkout@v4
        with:
          path: abi
      # WDBX was extracted to its own repository on 2026-08-22 and abi consumes
      # abi-foundation, abi-core, abi-telemetry, abi-compute, and abi-wdbx from
      # it by relative path. Cargo resolves `../wdbx/crates/...`, so the two
      # checkouts must be siblings or every job fails at manifest load.
      #
      # donaldfilimon/wdbx is PRIVATE, and the built-in GITHUB_TOKEN is scoped
      # to this repository only, so a separate credential is required. Set the
      # WDBX_CHECKOUT_TOKEN secret to a token with read access to it. Fork PRs
      # cannot read secrets, so the check-hosted job cannot pass while wdbx
      # stays private; that is a consequence of the visibility choice, not a
      # workflow defect.
      #
      # Fail with a sentence someone can act on, rather than a bare 403 from
      # actions/checkout. A gate that cannot run must say so loudly; skipping
      # the build would be a green result that proves nothing.
      - name: Require the substrate credential
        # shell: bash is REQUIRED, not stylistic. windows-latest defaults to
        # pwsh, which parses `if [ -z "..." ]; then` as a malformed PowerShell
        # `if` and dies with ParserError before the check ever runs.
        shell: bash
        run: |
          if [ -z "${{ secrets.WDBX_CHECKOUT_TOKEN }}" ]; then
            echo "::error::WDBX_CHECKOUT_TOKEN is not set. abi consumes"\
                 "abi-foundation, abi-core, abi-telemetry, abi-compute and"\
                 "abi-wdbx from the private donaldfilimon/wdbx"\
                 "repository by relative path, so this gate cannot run without"\
                 "read access to it. Add the secret, or make the substrate"\
                 "public and drop the token: line below."
            exit 1
          fi
        working-directory: .

      - name: Check out the WDBX substrate as a sibling
        uses: actions/checkout@v4
        with:
          repository: donaldfilimon/wdbx
          ref: ${{ env.WDBX_REVISION }}
          token: ${{ secrets.WDBX_CHECKOUT_TOKEN }}
          path: wdbx
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: ./tools/check.sh
        run: ./tools/check.sh

  # Windows credential DACL runtime proof (owner-only ACL apply + save_to_path).
  # Additive; does not replace the macOS primary gate.
  windows-acl:
    name: windows credential ACL
    if: >
      github.repository == 'donaldfilimon/abi' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: windows-latest
    defaults:
      run:
        working-directory: abi
    steps:
      - uses: actions/checkout@v4
        with:
          path: abi
      # WDBX was extracted to its own repository on 2026-08-22 and abi consumes
      # abi-foundation, abi-core, abi-telemetry, abi-compute, and abi-wdbx from
      # it by relative path. Cargo resolves `../wdbx/crates/...`, so the two
      # checkouts must be siblings or every job fails at manifest load.
      #
      # donaldfilimon/wdbx is PRIVATE, and the built-in GITHUB_TOKEN is scoped
      # to this repository only, so a separate credential is required. Set the
      # WDBX_CHECKOUT_TOKEN secret to a token with read access to it. Fork PRs
      # cannot read secrets, so the check-hosted job cannot pass while wdbx
      # stays private; that is a consequence of the visibility choice, not a
      # workflow defect.
      #
      # Fail with a sentence someone can act on, rather than a bare 403 from
      # actions/checkout. A gate that cannot run must say so loudly; skipping
      # the build would be a green result that proves nothing.
      - name: Require the substrate credential
        # shell: bash is REQUIRED, not stylistic. windows-latest defaults to
        # pwsh, which parses `if [ -z "..." ]; then` as a malformed PowerShell
        # `if` and dies with ParserError before the check ever runs.
        shell: bash
        run: |
          if [ -z "${{ secrets.WDBX_CHECKOUT_TOKEN }}" ]; then
            echo "::error::WDBX_CHECKOUT_TOKEN is not set. abi consumes"\
                 "abi-foundation, abi-core, abi-telemetry, abi-compute and"\
                 "abi-wdbx from the private donaldfilimon/wdbx"\
                 "repository by relative path, so this gate cannot run without"\
                 "read access to it. Add the secret, or make the substrate"\
                 "public and drop the token: line below."
            exit 1
          fi
        working-directory: .

      - name: Check out the WDBX substrate as a sibling
        uses: actions/checkout@v4
        with:
          repository: donaldfilimon/wdbx
          ref: ${{ env.WDBX_REVISION }}
          token: ${{ secrets.WDBX_CHECKOUT_TOKEN }}
          path: wdbx
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Windows ACL + credentials file tests
        shell: bash
        run: |
          cargo test -p abi-foundation --lib -- credentials::windows_acl
          cargo test -p abi-foundation --lib -- credentials::file
