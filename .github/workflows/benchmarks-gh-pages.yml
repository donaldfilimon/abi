name: Publish GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/benchmarks-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  # Runs on the macOS arm64 self-hosted runner registered to this repository
  # (label abi), because GitHub-hosted jobs cannot start while the account's
  # Actions billing is locked. This workflow has no pull_request trigger, so
  # only push to main and workflow_dispatch reach the self-hosted machine and
  # no GitHub-hosted fork fallback is needed. Runner notes:
  # .github/self-hosted-runner.md
  deploy:
    if: >
      github.repository == 'donaldfilimon/abi' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, macOS, ARM64, abi]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actions/upload-pages-artifact archives with `gtar` (GNU tar) when
      # runner.os is macOS; stock macOS ships only bsdtar. Fail early with a
      # clear message instead of a bare "gtar: not found" inside the action.
      - name: Check GNU tar on the runner host
        run: |
          if ! command -v gtar >/dev/null; then
            echo "::error::gtar is not on the runner PATH. Run 'brew install gnu-tar' on the runner host, make sure the runner's PATH includes the Homebrew bin directory, then restart the runner service."
            exit 1
          fi
          gtar --version | head -n 1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346

# Publishes `site/` through the GitHub Pages artifact/deployment API. The
# repository's Pages source must be GitHub Actions; this workflow never creates
# or writes a deployment branch. Site source and conventions: site/README.md.
