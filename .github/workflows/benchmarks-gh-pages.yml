name: Publish GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/benchmarks-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

# Publishes `site/` through the GitHub Pages artifact/deployment API. The
# repository's Pages source must be GitHub Actions; this workflow never creates
# or writes a deployment branch. Site source and conventions: site/README.md.
