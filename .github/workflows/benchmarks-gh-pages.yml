name: Publish GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/benchmarks-gh-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site

# Publishes the static site in `site/` (landing page + benchmark dashboard) to
# the `gh-pages` branch. That branch is a build artifact: it is written by this
# workflow and should never be edited by hand. Repository Pages settings point
# at `gh-pages` as the source. Site source and conventions: site/README.md.
